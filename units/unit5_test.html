<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5 Test</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Unit 5 Test: Colours</h1>
        <a href="unit5.html" style="color: white; text-decoration: none;">&larr; Back to Unit 5</a>
    </header>
    <main>
        <section class="unit-section quiz">
            <h2>单元测验 (Unit Test)</h2>
            <div class="quiz-question">1. What colour is this? 🔴</div>
            <ul class="quiz-options">
                <li class="quiz-option">blue</li>
                <li class="quiz-option" data-correct="true">red</li>
                <li class="quiz-option">green</li>
            </ul>
            <hr>
            <div class="quiz-question">2. Which word means "黑色"?</div>
            <ul class="quiz-options">
                <li class="quiz-option">yellow</li>
                <li class="quiz-option">green</li>
                <li class="quiz-option" data-correct="true">black</li>
            </ul>
            <hr>
            <div class="quiz-question">3. Complete the question: "What ___ is it?"</div>
            <ul class="quiz-options">
                <li class="quiz-option">is</li>
                <li class="quiz-option" data-correct="true">colour</li>
                <li class="quiz-option">a</li>
            </ul>
            <hr>
            <div class="quiz-question">4. An apple is usually ___.</div>
            <ul class="quiz-options">
                <li class="quiz-option" data-correct="true">red</li>
                <li class="quiz-option">blue</li>
                <li class="quiz-option">black</li>
            </ul>
        </section>
    </main>
    <script src="../script.js"></script>
</body>
</html>
