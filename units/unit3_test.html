<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 3 Test</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Unit 3 Test: Animals</h1>
        <a href="unit3.html" style="color: white; text-decoration: none;">&larr; Back to Unit 3</a>
    </header>
    <main>
        <section class="unit-section quiz">
            <h2>单元测验 (Unit Test)</h2>
            <div class="quiz-question">1. What is this? 🐒</div>
            <ul class="quiz-options">
                <li class="quiz-option">dog</li>
                <li class="quiz-option">cat</li>
                <li class="quiz-option" data-correct="true">monkey</li>
            </ul>
            <hr>
            <div class="quiz-question">2. Which word means "老虎"?</div>
            <ul class="quiz-options">
                <li class="quiz-option" data-correct="true">tiger</li>
                <li class="quiz-option">bird</li>
                <li class="quiz-option">dog</li>
            </ul>
            <hr>
            <div class="quiz-question">3. Complete the sentence: "What's ___?"</div>
            <ul class="quiz-options">
                <li class="quiz-option">is</li>
                <li class="quiz-option" data-correct="true">this</li>
                <li class="quiz-option">it</li>
            </ul>
            <hr>
            <div class="quiz-question">4. Complete the answer: "___ a cat." 🐱</div>
            <ul class="quiz-options">
                <li class="quiz-option">This is</li>
                <li class="quiz-option" data-correct="true">It's</li>
                <li class="quiz-option">I have</li>
            </ul>
        </section>
    </main>
    <script src="../script.js"></script>
</body>
</html>
