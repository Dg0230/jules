<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 4 Test</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Unit 4 Test: Numbers</h1>
        <a href="unit4.html" style="color: white; text-decoration: none;">&larr; Back to Unit 4</a>
    </header>
    <main>
        <section class="unit-section quiz">
            <h2>单元测验 (Unit Test)</h2>
            <div class="quiz-question">1. Which number is "seven"?</div>
            <ul class="quiz-options">
                <li class="quiz-option">6</li>
                <li class="quiz-option" data-correct="true">7</li>
                <li class="quiz-option">8</li>
            </ul>
            <hr>
            <div class="quiz-question">2. Which word means "five"?</div>
            <ul class="quiz-options">
                <li class="quiz-option">four</li>
                <li class="quiz-option" data-correct="true">five</li>
                <li class="quiz-option">six</li>
            </ul>
            <hr>
            <div class="quiz-question">3. How many are there? ⭐️⭐️⭐️⭐️⭐️⭐️</div>
            <ul class="quiz-options">
                <li class="quiz-option">five</li>
                <li class="quiz-option" data-correct="true">six</li>
                <li class="quiz-option">seven</li>
            </ul>
            <hr>
            <div class="quiz-question">4. Complete the question: "___ many are there?"</div>
            <ul class="quiz-options">
                <li class="quiz-option" data-correct="true">How</li>
                <li class="quiz-option">What</li>
                <li class="quiz-option">It's</li>
            </ul>
        </section>
    </main>
    <script src="../script.js"></script>
</body>
</html>
