    <main>
        <header class="subpage-header">
            <h1>常用语表</h1>
            <a href="../index.html" class="back-to-home">返回主地图</a>
        </header>
        <section class="unit-section">
            <h2>Starter: 入门用语</h2>
            <ul>
                <li><strong>Good morning!</strong> - 早上好！</li>
                <li><strong>Hello! / Hi!</strong> - 你好！/ 嗨！</li>
                <li><strong>What's your name?</strong> - 你叫什么名字？</li>
                <li><strong>My name is [Bill].</strong> - 我叫[比尔]。</li>
                <li><strong>Bye! / Goodbye!</strong> - 再见！</li>
            </ul>
        </section>
        <section class="unit-section">
            <h2>Unit 1: 课堂用语</h2>
            <ul>
                <li><strong>Stand up!</strong> - 起立！</li>
                <li><strong>Sit down, please.</strong> - 请坐下。</li>
                <li><strong>Open your eyes.</strong> - 睁开眼睛。</li>
            </ul>
        </section>
    </main>
