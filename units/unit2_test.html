<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 2 Test</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Unit 2 Test: Face</h1>
        <a href="unit2.html" style="color: white; text-decoration: none;">&larr; Back to Unit 2</a>
    </header>
    <main>
        <section class="unit-section quiz">
            <h2>单元测验 (Unit Test)</h2>
            <div class="quiz-question">1. What is this? 👃</div>
            <ul class="quiz-options">
                <li class="quiz-option">eye</li>
                <li class="quiz-option" data-correct="true">nose</li>
                <li class="quiz-option">ear</li>
            </ul>
            <hr>
            <div class="quiz-question">2. What is this? 👄</div>
            <ul class="quiz-options">
                <li class="quiz-option">face</li>
                <li class="quiz-option">ear</li>
                <li class="quiz-option" data-correct="true">mouth</li>
            </ul>
            <hr>
            <div class="quiz-question">3. Complete: "This is my ___." 😊</div>
            <ul class="quiz-options">
                <li class="quiz-option" data-correct="true">face</li>
                <li class="quiz-option">eye</li>
                <li class="quiz-option">nose</li>
            </ul>
            <hr>
            <div class="quiz-question">4. Which word means "耳朵"?</div>
            <ul class="quiz-options">
                <li class="quiz-option">eye</li>
                <li class="quiz-option">mouth</li>
                <li class="quiz-option" data-correct="true">ear</li>
            </ul>
        </section>
    </main>
    <script src="../script.js"></script>
