# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_service_db
spring.datasource.username=your_db_user
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update # Be cautious with this in production; consider validate or none with Flyway/Liquibase
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Schema Initialization from schema.sql
# This will run schema.sql on startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# In a production environment, you might use 'embedded' for tests and 'never' for prod,
# relying on a migration tool like Flyway or Liquibase.

# JWT Configuration
jwt.secret=YourSuperSecretKeyForJWTsWhichShouldBeLongAndComplexAndStoredSecurely
jwt.expirationMs=86400000 # 24 hours

# Server port (optional)
# server.port=8080

# Logging (optional example)
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Endpoints (optional - good for health checks, etc.)
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=always
